---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags:
    - common
    - packages

- name: Install common packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - vim
      - htop
      - unzip
      - jq
      - build-essential
      - python3-pip
    state: present
  tags:
    - common
    - packages

- name: Set timezone
  community.general.timezone:
    name: America/New_York
  tags:
    - common
    - timezone

- name: Create developer directory
  ansible.builtin.file:
    path: /opt/dev
    state: directory
    mode: "0755"
  tags:
    - common
